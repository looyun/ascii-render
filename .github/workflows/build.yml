name: Build Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ascii-render-linux
            upx_install: sudo apt-get update && sudo apt-get install -y upx-ucl
          - os: macos-latest
            artifact: ascii-render-macos
            upx_install: brew install upx
          - os: windows-latest
            artifact: ascii-render-windows.exe
            upx_install: |
              $url = "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip"
              Invoke-WebRequest -Uri $url -OutFile upx.zip -UseBasicParsing
              Expand-Archive -Path upx.zip -DestinationPath .
              $upxDir = (Get-ChildItem -Directory -Filter "upx-*").FullName
              echo "$upxDir" | Out-File -FilePath $env:GITHUB_PATH -Append

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UPX
        run: ${{ matrix.upx_install }}

      - name: Install dependencies
        run: pip install -e ".[build]"

      - name: Build with PyInstaller
        env:
          PYINSTALLER_NAME: ${{ matrix.artifact }}
        run: pyinstaller --clean build.spec

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
